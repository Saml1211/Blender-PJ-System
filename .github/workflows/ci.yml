name: CI

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.11 is what Blender 4.2 ships; 3.12 guards against future bundles.
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest==8.3.5 ruff==0.9.10

      - name: Lint
        run: ruff check blender_projection_system tests

      - name: Byte-compile everything
        run: python -m compileall -q blender_projection_system tests

      - name: Run the test suite
        run: pytest -v

  blender-smoke:
    name: Blender ${{ matrix.blender }} headless smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        blender: ['4.2.3']
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Cache Blender
        id: cache-blender
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ~/blender
          key: blender-${{ matrix.blender }}-linux-x64

      - name: Download Blender
        if: steps.cache-blender.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          VERSION="${{ matrix.blender }}"
          SERIES="${VERSION%.*}"
          URL="https://download.blender.org/release/Blender${SERIES}/blender-${VERSION}-linux-x64.tar.xz"
          echo "Fetching $URL"
          mkdir -p ~/blender
          curl -fsSL "$URL" | tar -xJ -C ~/blender --strip-components=1

      - name: Install Blender runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxi6 libxxf86vm1 libxfixes3 libxrender1 libgl1 libsm6 libegl1

      - name: Report Blender version
        run: ~/blender/blender --version

      - name: Validate and build the extension archive
        run: |
          ~/blender/blender --factory-startup --command extension validate blender_projection_system
          ~/blender/blender --factory-startup --command extension build \
            --source-dir blender_projection_system \
            --output-filepath /tmp/projection_planner.zip
          ~/blender/blender --factory-startup --command extension validate /tmp/projection_planner.zip

      # -b is background/headless. The script drives the real operators, so a
      # failure here means the add-on is broken in Blender, not just in pytest.
      - name: Register add-on and run the curved-wall workflow
        run: |
          ~/blender/blender -b --factory-startup --disable-autoexec \
            --python-exit-code 1 \
            --python tests/blender_smoke.py

  # Kept as a separate, explicitly named job so a green tick cannot be mistaken
  # for "the web app builds" - there is no web app. See docs/adr/0001.
  repo-hygiene:
    name: Repository hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Fail if dependency artefacts are tracked
        run: |
          set -euo pipefail
          if git ls-files | grep -E '(^|/)node_modules/' ; then
            echo "::error::node_modules is tracked in git; it must be ignored."
            exit 1
          fi
          echo "No tracked node_modules."

      - name: Fail if build output is tracked
        run: |
          set -euo pipefail
          if git ls-files | grep -E '(^|/)(dist|build)/' ; then
            echo "::error::Build output is tracked in git."
            exit 1
          fi
          echo "No tracked build output."

      - name: Fail on placeholder author text
        run: |
          set -euo pipefail
          if grep -rn "Your Name" blender_projection_system/ ; then
            echo "::error::Placeholder author text remains in the add-on."
            exit 1
          fi
          echo "No placeholder author text."
